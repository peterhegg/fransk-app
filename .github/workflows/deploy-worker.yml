name: Deploy Cloudflare Worker

# Opt-in: set repository variable WORKER_AUTO_DEPLOY=true and add secrets
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID. Keeps the Worker from drifting
# out of sync with the client.
on:
  push:
    branches: [main]
    paths: [cloudflare-worker.js, wrangler.toml]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.WORKER_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
